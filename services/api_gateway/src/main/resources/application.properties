spring.application.name=api_gateway

# Railway assigns PORT; 8080 is the local default.
server.port=${PORT:8080}

# Overridden by Railway env vars in production.
app.jwt.secret=${JWT_SECRET:asdfasdfasdccvsdfv1234567891loay}
app.jwt.issuer=${JWT_ISSUER:recruitment-auth}

spring.cloud.gateway.server.webflux.routes[0].id=user-auth
spring.cloud.gateway.server.webflux.routes[0].uri=${USER_AUTH_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=candidate
spring.cloud.gateway.server.webflux.routes[1].uri=${CANDIDATE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/candidates/**

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=unrestricted

# Multipart CV uploads pass through here - default buffer is 256KB.
spring.codec.max-in-memory-size=10MB

logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.example.api_gateway=DEBUG